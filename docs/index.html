<html lang="en">

    <style>
      :root {

        color: inherit;

    <main>
      <h1>Thai Trainer</h1>
      <section class="status" aria-labelledby="publishing-status">

        <p>No audio has been published yet.</p>
      </section>
      <p>
        The lesson feed will appear only after the approved lesson and its
        separately authorized, locally generated audio pass validation.
      </p>
      <p>
        <a href="https://github.com/justame/thai-trainer/blob/main/thai-learning/days/day-001.json">Review the current 20 written sentences</a>
